name: Backend CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew clean test

      - name: Build bootJar
        run: ./gradlew bootJar

      - name: Upload bootJar artifact
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-service
          path: build/libs/scheduler-service.jar

  deploy-test:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.NCP_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.NCP_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh "${{ secrets.NCP_USER }}@${{ secrets.NCP_HOST }}" "whoami && hostname"
      - name: Download bootJar artifact
        uses: actions/download-artifact@v4
        with:
          name: scheduler-service
          path: deploy-artifact

      - name: Upload bootJar to Naver Cloud
        run: |
          scp deploy-artifact/scheduler-service.jar \
             "${{ secrets.NCP_USER }}@${{ secrets.NCP_HOST }}:/home/deploy/scheduler-service.jar"