name: Backend CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew clean test

      - name: Build bootJar
        run: ./gradlew bootJar

      - name: Upload bootJar artifact
        uses: actions/upload-artifact@v4
        with:
          name: scheduler-service
          path: build/libs/scheduler-service.jar

  deploy:
    needs: build
    runs-on: self-hosted

    steps:
      - name: Download bootJar artifact
        uses: actions/download-artifact@v4
        with:
          name: scheduler-service
          path: deploy-artifact

      - name: Prepare deployment file
        run: |
          cp deploy-artifact/scheduler-service.jar /home/github-runner/deploy/scheduler-service.jar

      - name: Deploy application
        run: |
          sudo /usr/local/sbin/deploy-scheduler