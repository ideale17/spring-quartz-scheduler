spring.application.name=scheduler-service

# Quartz를 DB로 운영
spring.quartz.job-store-type=jdbc
spring.quartz.jdbc.initialize-schema=never

# Scheduler 이름
spring.quartz.scheduler-name=MyQuartzScheduler

# 예정된 실행 시각보다 60초 이상 지연된 Trigger를 misfire 대상으로 판단한다.
spring.quartz.properties.org.quartz.jobStore.misfireThreshold=60000

# MyBatis 설정
mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.kji.scheduler.dto
mybatis.configuration.map-underscore-to-camel-case=true
mybatis.configuration.log-impl=org.apache.ibatis.logging.slf4j.Slf4jImpl

logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - [fireId=%X{fireId}] %msg%n

# 세션 만료 시간
server.servlet.session.timeout=30m

# External API 호출 Timeout
external-api.connect-timeout=3000
external-api.read-timeout=10000

# 회원가입 허용 여부
app.security.signup-enabled=true

# External API 인증정보 암호화 키
app.security.encryption-key=${SCHEDULER_ENCRYPTION_KEY}

# CORS 허용 Origin
# 기본값은 허용하지 않으며, 환경별 profile에서 필요한 Origin만 설정한다.
app.security.cors-allowed-origins=